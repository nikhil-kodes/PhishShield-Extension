<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PhishShield AI — Secure Sandbox</title>
  <style>
    :root {
      --background: #09090b;
      --card: #141417;
      --foreground: #fafafa;
      --muted: #71717a;
      --border: #27272a;
      --primary: #3b82f6;
      --error: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Geist Sans', 'Inter', system-ui, sans-serif;
    }

    body {
      background: var(--background);
      color: var(--foreground);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #topbar {
      height: 60px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(20, 20, 23, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      z-index: 100;
      flex-shrink: 0;
      display: flex;
      align-items: center;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-right: 20px;
    }

    .logo svg {
      width: 22px;
      height: 22px;
      fill: var(--primary);
    }

    .logo span {
      font-weight: 900;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--foreground);
    }

    #urlInput {
      flex: 1;
      height: 38px;
      background: var(--background);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 16px;
      color: var(--foreground);
      font-size: 13px;
      font-family: 'JetBrains Mono', monospace;
      outline: none;
      transition: border 0.2s;
    }

    #urlInput:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
    }

    .btn {
      height: 38px;
      padding: 0 16px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
      text-transform: uppercase;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
      border: none;
    }

    .btn-primary:hover {
      background: #2563eb;
    }

    .btn-outline {
      background: transparent;
      border-color: var(--border);
      color: var(--muted);
    }

    .btn-outline:hover {
      border-color: var(--foreground);
      color: var(--foreground);
    }

    #frameWrap {
      flex: 1;
      position: relative;
      background: #000;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: white; /* Sites usually expect white bg */
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      padding: 4px 10px;
      border-radius: 100px;
      font-size: 10px;
      font-weight: 700;
      color: #10b981;
      text-transform: uppercase;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.4; }
      50% { opacity: 1; }
      100% { opacity: 0.4; }
    }

    #note {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.8);
      color: var(--muted);
      font-size: 9px;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      z-index: 1000;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="topbar">
    <div class="logo">
      <svg viewBox="0 0 24 24"><path d="M12 2L3 7v6a12 12 0 009 11 12 12 0 009-11V7l-9-5z"/></svg>
      <span>Shield Shell</span>
    </div>
    
    <div class="status-badge">
      <div class="dot"></div>
      Isolated Environment
    </div>

    <input id="urlInput" type="text" placeholder="Establishing Secure Bridge..." />
    
    <button class="btn btn-outline" id="goBtn">Refresh Scan</button>
    <button class="btn btn-primary" id="openOriginal">Exit Isolation</button>
  </div>

  <div id="frameWrap">
    <iframe id="sandframe" sandbox="allow-forms allow-same-origin allow-scripts allow-top-navigation"></iframe>
  </div>

  <div id="note">Protected by PhishShield AI Advanced Proactive Sandbox</div>
  <script src="sandbox.js"></script>
</body>
</html>
